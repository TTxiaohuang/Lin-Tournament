<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>林家谦歌曲锦标赛</title>
    <style>
        :root {
            --primary-color: #ffffff;
            --accent-color: #ffcc00;
            --overlay-bg: rgba(0, 0, 0, 0.4); /* 加深遮罩，增强对比度 */
            --blur-val: 12px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            padding: 0;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            height: 100dvh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('background.jpeg') no-repeat center center fixed;
            background-size: cover;
        }

        .glass-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(var(--blur-val));
            -webkit-backdrop-filter: blur(var(--blur-val));
            z-index: -1;
        }

        /* 核心 App 容器：智能适配不同屏幕比例 */
        .app-container {
            width: 100%;
            max-width: 50vh; /* 在大屏幕上维持手机比例 */
            height: 100%;
            display: none;
            flex-direction: column;
            padding: 4vh 20px 3vh 20px;
            position: relative;
        }

        #start-screen, #result-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100%;
            width: 100%;
            max-width: 50vh;
            padding: 20px;
            color: white;
        }

        .start-btn {
            padding: 15px 40px;
            font-size: 1.1rem;
            background: #ffffff;
            color: #333;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: 0.3s;
            font-weight: bold;
        }

        .start-btn:disabled { background: #666; color: #999; cursor: not-allowed; }
        .start-btn:not(:disabled):hover { transform: scale(1.05); background: var(--accent-color); }

        /* 顶部文字区域：自动填充空白空间 */
        .top-section {
            flex-grow: 1; /* 自动撑开，填补中间空白 */
            display: flex;
            flex-direction: column;
            justify-content: center; /* 让文字在垂直空间居中 */
            text-align: center;
            margin-bottom: 2vh;
        }

        .round-title { font-size: 0.85rem; color: #ccc; letter-spacing: 2px; }
        .zone-title { font-size: 1.25rem; margin: 10px 0; color: var(--accent-color); font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.5);}

        .remark-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ffffff; /* 强制改为白色 */
            background: rgba(0, 0, 0, 0.45); /* 稍微加深的半透明底色 */
            padding: 15px;
            border-radius: 12px;
            margin-top: 10px;
            border-left: 4px solid var(--accent-color);
            text-align: left;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5); /* 文字阴影增强可读性 */
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* 底部卡片区域：锁定比例 */
        .cards-container {
            display: flex;
            flex-direction: row;
            gap: 12px;
            width: 100%;
            padding-bottom: 10px;
        }

        .song-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 10px;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex; flex-direction: column; align-items: center;
        }

        .song-card:active { transform: scale(0.92); background: rgba(255, 255, 255, 0.2); }

        .album-cover {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            margin-bottom: 8px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .album-cover.loaded {
            opacity: 1;
        }

        .song-name {
            font-size: 0.95rem;
            font-weight: bold;
            color: white;
            display: -webkit-box;
            -webkit-line-clamp: 2; /* 歌名太长时自动换行，最多显示两行 */
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .champion-cover { width: 65vw; max-width: 250px; aspect-ratio: 1/1; border-radius: 20px; margin: 15px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        /* 排行榜弹层样式 */
        .ranking-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            overflow-y: auto;
            padding: 20px;
            color: white;
            animation: fadeIn 0.3s ease;
        }
        .ranking-modal-inner {
            max-width: 50vh;
            margin: 0 auto;
            padding-bottom: 40px;
        }
        .ranking-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .ranking-close-btn {
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }
        .ranking-close-btn:hover { background: rgba(255,255,255,0.3); }

        .ranking-item {
            margin-bottom: 12px;
            padding: 10px 12px;
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            transition: background 0.2s;
        }
        .ranking-item:hover { background: rgba(255,255,255,0.1); }
        .ranking-item-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .ranking-item-name { font-size: 0.95rem; }
        .ranking-item-votes {
            font-weight: bold;
            color: var(--accent-color);
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .ranking-bar-bg {
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            height: 5px;
            overflow: hidden;
        }
        .ranking-bar-fill {
            background: linear-gradient(90deg, var(--accent-color), #ffe066);
            height: 100%;
            border-radius: 4px;
            transition: width 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 辅助按钮样式 */
        .ghost-btn {
            padding: 12px 30px;
            font-size: 0.95rem;
            background: transparent;
            color: #fff;
            border: 2px solid rgba(255,255,255,0.5);
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }
        .ghost-btn:hover { border-color: var(--accent-color); color: var(--accent-color); }

        /* 存档提示条 */
        .save-toast {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%) translateY(-60px);
            background: rgba(0,0,0,0.75);
            color: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            font-size: 0.85rem;
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transition: all 0.4s ease;
            backdrop-filter: blur(6px);
        }
        .save-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* 排名徽章 */
        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 0.75rem;
            font-weight: bold;
            line-height: 1;
        }
        .rank-badge.gold { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #333; }
        .rank-badge.silver { background: linear-gradient(135deg, #c0c0c0, #a0a0a0); color: #333; }
        .rank-badge.bronze { background: linear-gradient(135deg, #cd7f32, #a0652a); color: #fff; }
        .rank-badge.normal { background: rgba(255,255,255,0.15); color: #aaa; }

        /* 加载旋转动画 */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }
    </style>
</head>
<body>

<div class="glass-overlay"></div>

<!-- 存档提示条 -->
<div class="save-toast" id="save-toast">进度已保存</div>

<audio id="main-bgm" loop preload="none">
    <source src="bgm.mp3" type="audio/mpeg">
</audio>

<div id="start-screen">
    <h1 style="font-size: 2rem; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.5);">林家谦锦标赛</h1>
    <p style="margin-bottom: 30px; opacity: 0.8; font-size: 0.85rem;">32首心头好，最终谁会留在你的"一人之境"？</p>
    <button class="start-btn" id="start-btn" onclick="startTournament()" disabled>资源加载中...</button>
    <div id="extra-buttons" style="margin-top: 15px; display: flex; flex-direction: column; gap: 10px; align-items: center;">
        <!-- 排行榜按钮（预加载完成后显示） -->
    </div>
</div>

<div class="app-container" id="game-container">
    <div class="top-section">
        <div class="round-title" id="round-display">LOADING...</div>
        <div id="zone-display" class="zone-title">赛区加载中</div>
        <div id="remark-display" class="remark-text">开场白加载中...</div>
    </div>

    <div class="cards-container">
        <div class="song-card" onclick="selectSong('A')">
            <img id="cover-a" class="album-cover" src="" alt="A">
            <div class="song-name" id="name-a">歌曲A</div>
        </div>
        <div class="song-card" onclick="selectSong('B')">
            <img id="cover-b" class="album-cover" src="" alt="B">
            <div class="song-name" id="name-b">歌曲B</div>
        </div>
    </div>
</div>

<div id="result-container" style="display: none;">
    <h2 style="color: var(--accent-color); margin-top: 0; font-size: 1.6rem; letter-spacing: 2px;">终极冠军</h2>
    <img id="champion-cover" class="champion-cover" src="" alt="Champion">
    <div class="song-name" id="champion-name" style="font-size: 1.5rem; margin-bottom: 15px;">歌曲名</div>

    <div id="ranking-list" style="width: 100%; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; text-align: left; color: #eee; box-shadow: inset 0 2px 10px rgba(0,0,0,0.2); font-size: 0.85rem; margin-bottom: 20px;">
    </div>

    <button class="start-btn" style="font-size: 1rem; padding: 12px 30px;" onclick="restartTournament()">重新开始比赛</button>
    <button class="ghost-btn" style="margin-top: 12px;" onclick="showGlobalRanking()">查看全网排行榜</button>
</div>

<!-- 全网排行榜弹层 -->
<div id="ranking-modal" class="ranking-modal">
    <div class="ranking-modal-inner">
        <div class="ranking-modal-header">
            <h2 style="color: var(--accent-color); margin: 0; font-size: 1.4rem; letter-spacing: 1px;">全网热度榜</h2>
            <button class="ranking-close-btn" onclick="closeGlobalRanking()">✕</button>
        </div>
        <div id="global-ranking-list">
            <div style="text-align:center; padding:40px 0; color:#888;">加载中...</div>
        </div>
    </div>
</div>

<script>
    const initialData = [
        { zone: "第一赛区：流行之巅的抉择", remark: "两首大概率是最多人入坑的歌。一首讲一个人也可以很尽兴，一首讲在反覆错爱里等下一位前度。你是享受独处的那种，还是怎么也放不下爱情的那种？", songA: "一人之境", songB: "下一位前度" },
        { zone: "第一赛区：流行之巅的抉择", remark: "黄伟文写的是想把那句「我喜欢你」吞回去，林夕写的是两个人各撑一叶舟、没能同行也不遗憾。一个拧巴，一个通透，你更吃哪一套？", songA: "时光倒流一句话", songB: "某种老朋友" },
        { zone: "第二赛区：四季流转的映画", remark: "春日部讲的是在暗涌里也要忙着发光，夏日之子讲的是暑天偏偏越冷越对。一个硬撑着乐观，一个就是要拧着来，都很林家谦。", songA: "春日部", songB: "夏日之子" },
        { zone: "第二赛区：四季流转的映画", remark: "一首用了「枯藤老树昏鸦」，一首写到漫天雪里互相赔过罪。都是冷色调的歌，但哪首更让你觉得冷？或者说，更让你觉得暖？", songA: "秋叶缘", songB: "冬季限定" },
        { zone: "第二赛区：四季流转的映画", remark: "四月物语里从来无牵手的章节，夏之风物诗里雪糕杯有一种美学。一个是春天没说出口的心事，一个是夏天不在意结果的快乐。", songA: "四月物语", songB: "夏之风物诗" },
        { zone: "第三赛区：众生相与处世法", remark: "两首歌都在讲「好人」这件事，但角度完全不同。一首是被人伤过之后变得吝啬信任，一首是面对自己也不敢变坏。你更怕被别人辜负，还是更怕辜负自己？", songA: "万一你是个好人", songB: "怪我只敢做好人" },
        { zone: "第三赛区：众生相与处世法", remark: "都是逃。一首说糊涂一点随心写结尾就好，一首说爬进时间沙漏十秒看春秋。一个选择迷糊地活，一个选择奇幻地活。", songA: "神奇的糊涂魔药", songB: "特伦斯梦游仙境" },
        { zone: "第三赛区：众生相与处世法", remark: "一首回望在多少遗憾中普渡众生，一首见步行步感觉着当刻宇宙。一个在回望中看开，一个在当下里沉浸。你更想往前看，还是往回看？", songA: "普渡众生", songB: "喃呒师感官漫游" },
        { zone: "第四赛区：怪癖与治愈的角落", remark: "一首写的是挑到最后优雅地折堕，一首写的是躺到化作世界的滋养。都是不太合群的人，但一个在纠结，一个已经释然了。", songA: "难道喜欢处女座", songB: "小林不动产" },
        { zone: "第四赛区：怪癖与治愈的角落", remark: "一首说在等待你能明白的耳，一首说种子已在发芽。一个想被听懂，一个闷头往前走。累的时候，你需要有人懂你，还是有人推你？", songA: "有你听我的故事", songB: "just carry on" },
        { zone: "第四赛区：怪癖与治愈的角落", remark: "一首拼了命要记住「曾有一份爱存在」，一首说骤变几多个都没终于的答案。你是那种会反复翻旧照片的人，还是删掉一切当没发生过的人？", songA: "记得", songB: "无答案" },
        { zone: "第五赛区：旅途、连结与放逐", remark: "一首是列车上两个陌生人瞬息间说你好吗，一首是谢幕时为了来年安歌拼命无恙。一个在路上遇见，一个在终点告别。你更在意相遇，还是更在意告别？", songA: "列车上对着坐的两个人", songB: "边一个发明了ENCORE" },
        { zone: "第五赛区：旅途、连结与放逐", remark: "doodoodoo在奇幻街道上记录未知土块，free fallin'在万呎高空里引力随负重归零。一个在地上蹦蹦跳跳，一个在天上往下掉。你想在哪一层？", songA: "doodoodoo", songB: "free fallin'" },
        { zone: "第五赛区：旅途、连结与放逐", remark: "一首悬在半空，相信这一刹感觉；一首漂在深海，放心漂到无人知晓海港。一个想抓住那个瞬间，一个想彻底放手。", songA: "在空中的这一秒", songB: "流离者的海" },
        { zone: "第五赛区：旅途、连结与放逐", remark: "你的世界说「你把我们的世界连成线」，隔离说「单剔隔绝我跟他」。一个在连，一个在断。最温柔的奔赴和最沉默的离开。", songA: "你的世界", songB: "隔离" },
        { zone: "最终赛区：极简的余韵", remark: "最后了。一首说平静的拥抱怒与哀乐，一首说归土归尘了了。一个选择承受，一个选择放下。听完这两首，这场锦标赛就结束了。", songA: "听风", songB: "了了" }
    ];

    // ============================================================
    //  localStorage 存档系统
    // ============================================================
    const STORAGE_KEY = 'lin-tournament-progress';

    function saveProgress() {
        try {
            const state = {
                currentMatches: currentMatches,
                nextRoundWinners: nextRoundWinners,
                matchIndex: matchIndex,
                timestamp: Date.now()
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            showSaveToast();
        } catch (e) {
            console.warn('存档失败:', e);
        }
    }

    function loadProgress() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (!raw) return false;
            const state = JSON.parse(raw);
            // 超过 24 小时自动作废
            if (!state.timestamp || Date.now() - state.timestamp > 24 * 60 * 60 * 1000) {
                localStorage.removeItem(STORAGE_KEY);
                return false;
            }
            // 校验数据完整性
            if (!Array.isArray(state.currentMatches) || typeof state.matchIndex !== 'number') {
                localStorage.removeItem(STORAGE_KEY);
                return false;
            }
            currentMatches = state.currentMatches;
            nextRoundWinners = state.nextRoundWinners || [];
            matchIndex = state.matchIndex;
            return true;
        } catch {
            localStorage.removeItem(STORAGE_KEY);
            return false;
        }
    }

    function clearProgress() {
        localStorage.removeItem(STORAGE_KEY);
    }

    function showSaveToast() {
        const toast = document.getElementById('save-toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1500);
    }

    // ============================================================
    //  全网排行榜
    // ============================================================
    async function showGlobalRanking() {
        document.getElementById('ranking-modal').style.display = 'block';
        document.body.style.overflow = 'hidden';
        const listDiv = document.getElementById('global-ranking-list');
        listDiv.innerHTML = '<div style="text-align:center; padding:40px 0; color:#888;">正在加载...</div>';
        try {
            const res = await fetch('/api/vote?top=32');
            if (!res.ok) {
                let errDetail = '';
                try { const errJson = await res.json(); errDetail = errJson.detail || errJson.error || ''; } catch {}
                throw new Error(`HTTP ${res.status}${errDetail ? ' — ' + errDetail : ''}`);
            }
            const songs = await res.json();
            if (!songs.length) {
                listDiv.innerHTML = '<div style="text-align:center; padding:40px 0; color:#888;">暂无投票数据</div>';
                return;
            }
            const maxVotes = songs[0].votes || 1;
            let html = '';
            songs.forEach((song, i) => {
                const medal = i === 0 ? '<span class="rank-badge gold">1</span>' : i === 1 ? '<span class="rank-badge silver">2</span>' : i === 2 ? '<span class="rank-badge bronze">3</span>' : `<span class="rank-badge normal">${i + 1}</span>`;
                const barWidth = Math.round((song.votes / maxVotes) * 100);
                html += `<div class="ranking-item">
                    <div class="ranking-item-header">
                        <span class="ranking-item-name">${medal} 《${song.songName}》</span>
                        <span class="ranking-item-votes">${song.votes} 次</span>
                    </div>
                    <div class="ranking-bar-bg">
                        <div class="ranking-bar-fill" style="width:${barWidth}%"></div>
                    </div>
                </div>`;
            });
            listDiv.innerHTML = html;
        } catch (e) {
            console.error('排行榜加载失败:', e);
            listDiv.innerHTML = `<div style="text-align:center; padding:30px; color:#ff4444; border:1px dashed #ff4444; border-radius:10px; background:rgba(255,0,0,0.08);">
                加载失败：${e.message}<br><span style="color:#888; font-size:0.8rem;">请稍后再试</span>
            </div>`;
        }
    }

    function closeGlobalRanking() {
        document.getElementById('ranking-modal').style.display = 'none';
        document.body.style.overflow = '';
    }

    // 点击弹层背景关闭
    document.getElementById('ranking-modal').addEventListener('click', function(e) {
        if (e.target === this) closeGlobalRanking();
    });

    // ============================================================
    //  页面初始化（不阻塞开始按钮）
    // ============================================================
    window.addEventListener('DOMContentLoaded', () => {
        const startBtn = document.getElementById('start-btn');

        // 检查是否有存档
        if (loadProgress()) {
            startBtn.innerText = "继续上次比赛";
        } else {
            startBtn.innerText = "开始对决";
        }
        startBtn.disabled = false;

        // 显示排行榜按钮
        const extraButtons = document.getElementById('extra-buttons');
        extraButtons.innerHTML = '<button class="ghost-btn" onclick="showGlobalRanking()">查看全网排行榜</button>';

        // 背景图和音乐在后台静默加载
        const bgImg = new Image();
        bgImg.src = 'background.jpeg';
        const bgm = document.getElementById('main-bgm');
        bgm.preload = "metadata";
        bgm.load();
    });

    // ============================================================
    //  按比赛顺序依次加载封面（支持并行 + 优先插队）
    // ============================================================
    const coverCache = new Set();
    const coverQueue = [];
    let coversInFlight = 0;
    const MAX_PARALLEL = 3; // 同时最多 3 张并行加载

    // 按比赛顺序排列所有歌曲名（去重）
    function buildCoverQueue() {
        const seen = new Set();
        const ordered = [];
        initialData.forEach(match => {
            [match.songA, match.songB].forEach(name => {
                if (!seen.has(name)) {
                    seen.add(name);
                    ordered.push(name);
                }
            });
        });
        coverQueue.length = 0;
        coverQueue.push(...ordered);
        processCoverQueue();
    }

    // 加速：优先加载指定歌曲（插到队首）
    function prioritizeCovers(songNames) {
        songNames.forEach(name => {
            if (coverCache.has(name)) return;
            const idx = coverQueue.indexOf(name);
            if (idx > 0) {
                coverQueue.splice(idx, 1);
                coverQueue.unshift(name);
            }
        });
        processCoverQueue();
    }

    // 并行加载队列中的封面
    function processCoverQueue() {
        while (coversInFlight < MAX_PARALLEL && coverQueue.length > 0) {
            const name = coverQueue.shift();
            if (coverCache.has(name)) continue;
            coverCache.add(name);
            coversInFlight++;
            const img = new Image();
            img.onload = img.onerror = () => {
                coversInFlight--;
                processCoverQueue();
            };
            img.src = `covers/${name}.jpg`;
        }
    }

    // 预加载下一场的封面（渲染当前比赛时调用）
    function preloadNextMatch() {
        const nextIdx = matchIndex + 1;
        if (nextIdx < currentMatches.length) {
            prioritizeCovers([currentMatches[nextIdx].songA, currentMatches[nextIdx].songB]);
        }
    }

    let currentMatches = [...initialData];
    let nextRoundWinners = [];
    let matchIndex = 0;
    const roundsInfo = { 16: "32进16", 8: "16进8", 4: "8进4", 2: "半决赛", 1: "总决赛" };

    function startTournament() {
        document.getElementById('main-bgm').play().catch(e => console.log("等待交互"));
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-container').style.display = 'flex';
        buildCoverQueue(); // 按比赛顺序启动封面加载
        renderMatch();
    }

    // === 重新开始逻辑 ===
    function restartTournament() {
        // 重置所有比赛数据到初始状态
        currentMatches = [...initialData];
        nextRoundWinners = [];
        matchIndex = 0;
        clearProgress(); // 清除存档

        // 隐藏结果界面，重新显示比赛界面
        document.getElementById('result-container').style.display = 'none';
        document.getElementById('game-container').style.display = 'flex';

        // 重新渲染第一场比赛卡片
        renderMatch();
    }

    function renderMatch() {
        const match = currentMatches[matchIndex];
        document.getElementById('round-display').innerText = `${roundsInfo[currentMatches.length]} · 组别 ${matchIndex + 1} / ${currentMatches.length}`;

        if (currentMatches.length === 16) {
            document.getElementById('zone-display').innerText = match.zone;
            document.getElementById('remark-display').innerText = match.remark;
            document.getElementById('zone-display').style.display = 'block';
            document.getElementById('remark-display').style.display = 'block';
        } else {
            document.getElementById('zone-display').style.display = 'none';
            document.getElementById('remark-display').style.display = 'none';
        }

        document.getElementById('name-a').innerText = match.songA;
        document.getElementById('name-b').innerText = match.songB;

        setCoverWithFade('cover-a', `covers/${match.songA}.jpg`);
        setCoverWithFade('cover-b', `covers/${match.songB}.jpg`);

        preloadNextMatch();
    }

    // 封面带淡入效果：已缓存立即显示，未缓存加载后淡入
    function setCoverWithFade(imgId, src) {
        const img = document.getElementById(imgId);
        // 检查是否已缓存（浏览器内存中有这张图）
        const cached = coverCache.has(src.replace('covers/', '').replace('.jpg', ''));
        if (cached) {
            img.classList.add('loaded');
        } else {
            img.classList.remove('loaded');
        }
        img.src = src;
        // 图片加载完成后淡入
        img.onload = () => img.classList.add('loaded');
        img.onerror = () => img.classList.add('loaded');
    }

    function selectSong(choice) {
        const match = currentMatches[matchIndex];
        nextRoundWinners.push(choice === 'A' ? match.songA : match.songB);
        matchIndex++;

        if (matchIndex >= currentMatches.length) {
            if (nextRoundWinners.length === 1) {
                clearProgress();
                return showChampion(nextRoundWinners[0]);
            }
            // 轮次切换：创建新轮次并立即预加载第一场封面
            const winners = [...nextRoundWinners];
            currentMatches = [];
            for (let i = 0; i < winners.length; i += 2) {
                currentMatches.push({ songA: winners[i], songB: winners[i+1] });
            }
            nextRoundWinners = [];
            matchIndex = 0;
            // 立即预加载新轮次前几场的封面
            prioritizeCovers([currentMatches[0].songA, currentMatches[0].songB]);
            if (currentMatches.length > 1) {
                prioritizeCovers([currentMatches[1].songA, currentMatches[1].songB]);
            }
        }

        saveProgress();
        renderMatch();
    }

    function showChampion(songName) {
        document.getElementById('game-container').style.display = 'none';
        document.getElementById('result-container').style.display = 'flex';
        document.getElementById('champion-name').innerText = `《${songName}》`;
        document.getElementById('champion-cover').src = `covers/${songName}.jpg`;
        submitAndShowRanking(songName);
    }

    async function submitAndShowRanking(songName) {
        const rankingDiv = document.getElementById('ranking-list');
        rankingDiv.innerHTML = "<div style='text-align:center;'><span class='spinner'></span>正在连接服务器...</div>";
        try {
            const response = await fetch('/api/vote', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ songName: songName })
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`HTTP ${response.status} | 详情: ${errorText || '无返回值'}`);
            }

            const topSongs = await response.json();

            let html = "<h3 style='color: var(--accent-color); text-align: center; margin-top: 0;'>全网热度榜</h3>";
            html += "<ul style='list-style:none; padding:0; margin:0;'>";
            topSongs.forEach((song, index) => {
                let medal = index === 0 ? '<span class="rank-badge gold">1</span>' : index === 1 ? '<span class="rank-badge silver">2</span>' : index === 2 ? '<span class="rank-badge bronze">3</span>' : `<span class="rank-badge normal">${index + 1}</span>`;
                html += `<li style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;">
                            <span>${medal} 《${song.songName}》</span>
                            <span style="font-weight: bold; color: var(--accent-color);">${song.votes} 次</span>
                         </li>`;
            });
            html += "</ul>";
            rankingDiv.innerHTML = html;
        } catch (e) {
            console.error("彻底失败了:", e);
            rankingDiv.innerHTML = `<div style='text-align:center; color:#ff6b6b; font-size:0.85rem; padding: 12px; border: 1px solid rgba(255,107,107,0.3); background: rgba(255,107,107,0.08); border-radius: 10px;'>
                加载失败，请稍后重试<br>
                <span style="color:#666; font-size:0.75rem;">${e.message}</span>
            </div>`;
        }
    }
</script>

</body>
</html>
